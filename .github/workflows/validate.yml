# Tests und Prüfungen bei jedem Push, jeder Pull-Request und wöchentlich
# (hassfest und HACS ändern ihre Regeln, ohne dass sich hier etwas tut).
name: Prüfen

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests, ruff, Importstruktur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/python tools/quality/quality_scan.py --gate structural

  hassfest:
    name: hassfest (Manifest, Übersetzungen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS-Validierung
    runs-on: ubuntu-latest
    steps:
      # „brands": Icon und Logo liegen in custom_components/triplesolar/brand/,
      # nicht im brands-Repository, das HACS hier prüft.
      - uses: hacs/action@22.5.0
        with:
          category: integration
          ignore: brands
